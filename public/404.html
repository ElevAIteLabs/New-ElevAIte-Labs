<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Page not found — ElevAIte Labs</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #f8fafc; color: #0f172a; padding: 24px;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      .wrap { max-width: 520px; text-align: center; }
      .code { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #1e88e5; margin-bottom: 16px; }
      h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 800; letter-spacing: -.02em; margin: 0 0 12px; }
      p { color: #64748b; font-size: 17px; line-height: 1.6; margin: 0 0 32px; }
      .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a {
        display: inline-block; padding: 13px 24px; border-radius: 12px;
        font-weight: 700; font-size: 15px; text-decoration: none; transition: transform .15s ease;
      }
      a:hover { transform: translateY(-1px); }
      .primary { background: #0f172a; color: #fff; }
      .ghost { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">Error 404</div>
      <h1>We couldn't find that page</h1>
      <p>The link may be out of date, or the page may have moved. Here's where to go instead.</p>
      <div class="links">
        <a class="primary" href="/">Go home</a>
        <a class="ghost" href="/services">Our services</a>
        <a class="ghost" href="/contact">Contact us</a>
      </div>
    </div>
  </body>
</html>
