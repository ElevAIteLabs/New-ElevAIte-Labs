<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google only considers a favicon it can read at 16px: it must be square
         and a multiple of 48px. The 480x480 file satisfies both. -->
    <link rel="icon" type="image/png" sizes="480x480" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title and meta tags are supplied per route by src/components/Seo.jsx
         and captured into the prerendered HTML. A static title element here
         would take precedence over React's hoisted one, so every page would
         end up sharing it. -->
    <meta name="theme-color" content="#0f172a" />
    <!-- The GA4 tag is not here. vite.config.js injects it from VITE_GA_ID,
         which adds the same tag to this file and to every prerendered page,
         but skips localhost - otherwise scripts/prerender.mjs, which drives a
         real browser over every route, would file a full set of pageviews on
         each build. A copy here as well would count every visit twice. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
